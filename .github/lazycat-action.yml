version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: jackett

build:
  toolchains: []
  run_buildscript: false

images:
  - id: jackett
    target: service
    service: jackett
    source: docker.io/linuxserver/jackett
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Jackett
    summary: API Support for your favorite torrent trackers
